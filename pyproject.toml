[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeai"
version = "0.1.0"
description = "Local AI Agent Forge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ForgeAI Contributors" }
]
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "chromadb>=0.4.0",
    "streamlit>=1.30.0",
    "fastapi>=0.109.0",
    "playwright>=1.40.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
forgeai = "forgeai.main:cli"
